# ==============================================================================
# Workload Definition File (WDF) for VoiceRAG Application
# ==============================================================================
# This WDF deploys the VoiceRAG application that implements RAG support in 
# applications using voice as their user interface, powered by Azure OpenAI 
# models (gpt-realtime-mini for transcription and text-to-speech, gpt-5-mini 
# for chat). Uses Azure AI Search for vector search and retrieval augmented generation.
# Source: https://github.com/7sg-ai/aisearch-openai-rag-audio
#
# The orchestrator will:
# 1. Git Collector Minion: Clone the git repository (aisearch-openai-rag-audio repo, branch: main)
#    to NFS at /mnt/nfs/<org_id>/user-<user_id>/<version>/git_repos/clones/
# 2. Secret Manager Minion: Extract secrets (Azure OpenAI keys, Azure Search keys, etc.) 
#    from Azure Key Vault and place them in NFS at /mnt/nfs/<org_id>/user-<user_id>/<version>/env/
# 3. Env Setup Minion: Generate Terraform scripts for Azure resources (if needed)
#    and store them in NFS at /mnt/nfs/<org_id>/user-<user_id>/<version>/terraform/
# 4. Deployment Minion: Build Docker images from the locally cloned repository
#    (Backend service using Dockerfile in ./app directory)
# 5. Deployment Minion: Push Docker images to Azure Container Registry (ACR)
# 6. Deployment Minion: Deploy to Azure Container Instances (ACI) or Azure Kubernetes Service (AKS)
# 7. Deployment Minion: Inject environment variables from NFS env directory
# 8. Monitoring Minion: Verify application is live and functional
#
# Prerequisites:
# - Azure Key Vault secrets must exist (azure-openai-endpoint, azure-openai-api-key, 
#   azure-search-endpoint, azure-search-api-key, etc.)
# - Azure Container Registry (ACR) must exist
# - Azure Key Vault and ACR credentials are configured in this WDF (secrets.azureKeyVault and acr sections)
# - Target Definition File (TDF) must be referenced for platform, regions, and deployment credentials
# - Azure AI Search index must be created and populated with document embeddings
# - Azure Blob Storage container must contain documents for indexing
# - Azure credentials are configured in the TDF (credentials.azure section)
#
# Configuration Structure:
# - modifications: Repository modifications required before build (if any) - read by Deployment Minion
# - build: Docker build configuration (application-specific) - read by Deployment Minion
# - secrets.azureKeyVault: Azure Key Vault configuration (read by Secret Manager Minion)
# - acr: Azure Container Registry configuration (read by Deployment Minion)
# - Platform and regions: Defined in TDF (not in WDF)
# - Deployment credentials: Defined in TDF (credentials.azure)
# - Runtime environment variables: Defined in TDF (env section) - target-specific configuration
# - Resource limits and autoscaling: Defined in TDF (resources and scaling sections) - target-specific configuration
# ==============================================================================

apiVersion: wdf.7sg.ai/v1
kind: WorkloadDefinition
version: "1.0.0"
metadata:
  name: aisearch-openai-rag-audio
  tags:
    env: production
    app: voicerag
    type: api-service
    framework: fastapi-aiohttp
    llm: azure-openai
    voice: realtime-api
    rag: azure-ai-search
  org_id: "7sg-ai"
  id: "aisearch-openai-rag-audio"
  workload_id: "aisearch-openai-rag-audio"
  version: "1.0.0"
  description: "VoiceRAG application that implements RAG support in applications using voice as their user interface, powered by Azure OpenAI models"
  author: "udith@7sg.ai"
  created_at: "2024-11-25T00:00:00Z"
  updated_at: "2024-11-25T00:00:00Z"
  status: "active"

workload:
  type: voicerag-api
  repo: https://github.com/7sg-ai/aisearch-openai-rag-audio.git
  branch: main
  path: .  # Root of the repository
  
  # Target Definition File (TDF) reference
  # NOTE: ACI deployments don't require TDF - TDF is only needed for Kubernetes cluster configuration
  # Since this workload deploys to Azure Container Instances (ACI), TDF reference is not needed
  # target:
  #   # Option 1: Reference by TDF metadata name (not needed for ACI)
  #   # reference: production-azure
  #   # Option 2: Reference by TDF file name (alternative)
  #   # file: target-definition-azure.yaml
  #   # Option 3: Reference by full path (alternative)
  #   # path: https://sherpa.ai/tdfs/production-azure.yaml
  
  # Repository modifications - required changes to the cloned repository
  # These modifications must be applied before building the Docker images
  # The Deployment Minion will apply these changes to the cloned repository
  modifications:
    description: |
      The VoiceRAG application is already containerized with Dockerfiles.
      For production deployment, we may need to ensure:
      1. Health check endpoints are properly configured
      2. Environment variables are correctly set
      3. CORS settings are configured for frontend access
      4. Dependencies are properly installed
    # Required modifications (if any):
    required_changes: []
      # Example modifications if needed:
      # - type: add_file
      #   path: .env.production
      #   description: "Add production environment configuration"
      # - type: update_file
      #   path: app/backend/main.py
      #   description: "Ensure health check endpoint exists"
  
  # Docker build configuration - Enhanced for production deployments
  # The Deployment Minion uses this to build the Docker images
  # Note: This application has a backend service with Dockerfile in ./app directory
  build:
    # Base image for the Docker container
    base_image: python:3.11-slim
    # Build context (relative to the cloned repository path)
    context: ./app
    # Dockerfile path (relative to build context)
    dockerfile: Dockerfile  # Dockerfile for backend service in ./app directory
    
    # Build optimizations
    optimization:
      # Use multi-stage build for smaller final image
      multi_stage: true
      # Enable BuildKit for faster builds
      use_buildkit: true
      # Cache mount for pip dependencies (faster rebuilds)
      cache_mounts:
        - type: cache
          target: /root/.cache/pip
          id: pip-cache
        - type: cache
          target: /app/.cache
          id: app-cache
    
    # Build arguments (can be overridden per target if needed)
    build_args:
      PYTHON_VERSION: "3.11"
      BUILD_VERSION: "latest"
      # Additional build args can be added here
    
    # Exposed ports (application ports)
    ports:
      - 8000  # Backend API port (FastAPI/aiohttp)
    
    # Build steps (if dockerfile is 'auto', these guide the auto-generation)
    # For Python/FastAPI/aiohttp applications:
    steps:
      # Install system dependencies
      system_dependencies:
        - curl  # For health checks
        - wget  # For downloading data if needed
      # Install application dependencies
      install_dependencies: true  # Runs 'pip install -r requirements.txt'
      # Build the application (if needed)
      build: false  # Python doesn't require build step
      # Default command to run the application
      command:
        # Priority order for backend service:
        - python3 -m gunicorn app:create_app -b 0.0.0.0:8000 --worker-class aiohttp.GunicornWebWorker
        - gunicorn app:create_app -b 0.0.0.0:8000 --worker-class aiohttp.GunicornWebWorker
        - python -m uvicorn app:app --host 0.0.0.0 --port 8000
      # Pre-build scripts (optional)
      pre_build:
        - echo "Building VoiceRAG application"
        - echo "Installing system dependencies"
      # Post-build scripts (optional)
      post_build:
        - echo "Build completed successfully"
        - echo "Verifying Python installation"
  
  # Deployment configuration - Enhanced for Azure Container Instances / Kubernetes
  deploy:
    # Azure Container Instances deployment configuration
    azure_container_instances:
      # Backend Service
      backend_service:
        name: uv-voicerag-app
        image: uvvoiceragacr.azurecr.io/uv-voicerag-app:latest
        dockerfile: ./app/Dockerfile
        resources:
          cpu: "1"  # CPU cores (can be increased if quota allows)
          memory: "2"  # Memory in GiB
        ports:
          - port: 8000
            protocol: TCP
        dns_name_label: uv-voicerag-app
        osType: Linux
        restartPolicy: Always
        # Environment variables will be injected from NFS env directory
    
    # Kubernetes deployment configuration (alternative to ACI)
    kubernetes:
      # Replica configuration
      replicas:
        min: 1  # Minimum replicas for backend service
        max: 10  # Maximum replicas for scaling
        initial: 2  # Initial replica count
      
      # Deployment strategy
      strategy:
        type: rolling  # rolling, blue-green, or canary
        rolling:
          max_surge: 1  # Number of pods that can be created above desired count
          max_unavailable: 0  # Number of pods that can be unavailable during update
      
      # Service configuration
      service:
        type: LoadBalancer  # ClusterIP, NodePort, or LoadBalancer
        ports:
          - name: api
            port: 80
            target_port: 8000
            protocol: TCP
        # Service annotations (for cloud provider specific features)
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-type: "external"
      
      # Ingress configuration (optional)
      ingress:
        enabled: true
        class: nginx  # or azure/application-gateway for Azure
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-prod"
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
        hosts:
          - host: voicerag.example.com  # Replace with your domain
            paths:
              - path: /
                pathType: Prefix
                service: backend
        tls:
          - secretName: voicerag-tls
            hosts:
              - voicerag.example.com
      
      # Pod annotations and labels
      pod_annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      pod_labels:
        app: voicerag
        version: latest
        component: backend-service
  
  runtime:
    # Platform and regions - Required by schema
    # For ACI deployments, platform should be 'azure_container_instances' or 'aci' to skip TDF validation
    # These can be overridden by TDF, but are required here for schema compliance
    platform: aci  # ACI platform - skips TDF validation (options: kubernetes, serverless, vm, batch, spark, custom, azure, azure_container_instances, aci)
    regions:
      - eastus  # Deployment regions
    
    # Docker image configuration - Enhanced with versioning
    image:
      repository: uv-voicerag-app
      tag: latest  # Will be replaced with deployment-specific tag (e.g., <deployment_id> or <git_sha>)
      # Image tagging strategy
      tagging:
        strategy: deployment_id  # deployment_id, git_sha, timestamp, or latest
        include_latest: true  # Also tag as 'latest' for convenience
      # Image will be built by the Deployment Minion from the locally cloned repository
      # (cloned by Git Collector Minion to NFS) using the build configuration above
      # Image will be pushed to Azure Container Registry (ACR) as configured below
    
    # Resource requirements - Workload-specific resource needs
    # Enhanced for voice processing and RAG workloads
    # These can override or complement TDF defaults
    resources:
      requests:
        cpu: "1000m"  # Minimum CPU required (1 core) for backend service
        memory: "2Gi"  # Minimum memory required (2 GB) for voice processing
        ephemeral_storage: "5Gi"  # Minimum ephemeral storage for temporary audio files
      limits:
        cpu: "2"  # Maximum CPU allowed (2 cores)
        memory: "4Gi"  # Maximum memory allowed (4 GB) for audio processing
        ephemeral_storage: "10Gi"  # Maximum ephemeral storage
      # Note: TDF may override these with target-specific values
    
    # Health check configuration - Enhanced for production
    health:
      # Liveness probe - indicates if container is running
      liveness:
        path: /health
        port: 8000
        scheme: HTTP  # HTTP or HTTPS
        initial_delay_seconds: 30  # Wait 30s before first check
        period_seconds: 30  # Check every 30s
        timeout_seconds: 10  # 10s timeout per check
        failure_threshold: 3  # 3 failures = restart container
        success_threshold: 1  # 1 success = healthy
        # HTTP headers (optional)
        http_headers:
          - name: User-Agent
            value: kube-probe/1.0
      # Readiness probe - indicates if container is ready to serve traffic
      readiness:
        path: /health
        port: 8000
        scheme: HTTP
        initial_delay_seconds: 15  # Wait 15s before first check
        period_seconds: 10  # Check every 10s
        timeout_seconds: 5  # 5s timeout per check
        failure_threshold: 3  # 3 failures = remove from service
        success_threshold: 1  # 1 success = ready
      # Startup probe - for slow-starting applications
      startup:
        path: /health
        port: 8000
        scheme: HTTP
        initial_delay_seconds: 0  # Start checking immediately
        period_seconds: 10  # Check every 10s
        timeout_seconds: 5  # 5s timeout per check
        failure_threshold: 30  # Allow up to 5 minutes (30 * 10s) for startup
        success_threshold: 1  # 1 success = started
    
    # Environment variables - Enhanced configuration
    env:
      # Application-specific environment variables
      - name: NODE_ENV
        value: production
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: LOG_LEVEL
        value: "INFO"
      - name: PORT
        value: "8000"
      - name: API_HOST
        value: "0.0.0.0"
      - name: API_TITLE
        value: "VoiceRAG API"
      - name: API_VERSION
        value: "1.0.0"
      - name: AZURE_OPENAI_REALTIME_DEPLOYMENT
        value: "gpt-realtime-mini"  # For transcription and text-to-speech
      - name: AZURE_OPENAI_CHAT_DEPLOYMENT
        value: "gpt-5-mini"  # For chat completions
      - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        value: "text-embedding-3-large"  # For embeddings
      - name: AZURE_OPENAI_REALTIME_VOICE_CHOICE
        value: "echo"  # Voice choice: echo, alloy, shimmer
      - name: AZURE_OPENAI_API_VERSION
        value: "2024-02-15-preview"
      - name: AZURE_SEARCH_INDEX
        value: "voicerag-index"
      - name: AZURE_SEARCH_SEMANTIC_CONFIGURATION
        value: ""  # Optional: semantic configuration name if using semantic search
      - name: AZURE_SEARCH_IDENTIFIER_FIELD
        value: "chunk_id"  # Field name for document identifier
      - name: AZURE_SEARCH_CONTENT_FIELD
        value: "chunk"  # Field name for content text
      - name: AZURE_SEARCH_EMBEDDING_FIELD
        value: "text_vector"  # Field name for embeddings
      - name: AZURE_SEARCH_TITLE_FIELD
        value: "title"  # Field name for document title
      - name: AZURE_SEARCH_USE_VECTOR_QUERY
        value: "true"  # Use vector search queries
      - name: TZ
        value: "UTC"
      # Azure service endpoints and keys
      - name: RUNNING_IN_PRODUCTION
        value: "true"
      # Azure service endpoints and keys are loaded from Azure Key Vault via secrets.secretRefs
      # Additional env vars can be added here
      # They will be merged with TDF env vars (TDF takes precedence)
    
    # Environment variables from secrets (loaded at runtime, not build time)
    envFromSecretRefs:
      - azure-openai-endpoint
      - azure-openai-api-key
      - azure-search-endpoint
      - azure-search-api-key
      - azure-storage-account-name
      - azure-storage-account-key
      - azure-storage-connection-string
      - azure-storage-container
      # Secrets will be extracted by Secret Manager Minion from Azure Key Vault
      # and placed in NFS env directory: /mnt/nfs/<org_id>/user-<user_id>/<version>/secrets/<deployment_id>/
      # The Deployment Minion will load these environment variables during deployment
      # Resources and autoscaling are defined in TDF (target-specific configuration)
    
    # Autoscaling configuration - Workload-specific scaling
    autoscaling:
      enabled: true
      min_replicas: 1  # Minimum replicas (for high availability)
      max_replicas: 10  # Maximum replicas for scaling
      target_cpu_utilization: 70  # Scale when CPU > 70%
      target_memory_utilization: 80  # Scale when memory > 80%
      # Custom metrics (optional)
      # metrics:
      #   - type: Pods
      #     pods:
      #       metric:
      #         name: requests-per-second
      #       target:
      #         type: AverageValue
      #         averageValue: "10"
    
    # Lifecycle hooks
    lifecycle:
      pre_stop:
        # Graceful shutdown hook
        exec:
          command: ["/bin/sh", "-c", "sleep 15"]  # Give time for connections to drain
      post_start:
        # Optional: post-start hook
        # exec:
        #   command: ["/bin/sh", "-c", "echo 'Container started'"]
  
  # Monitoring and observability configuration
  monitoring:
    # Metrics endpoint (if available)
    metrics:
      enabled: true
      path: /metrics  # Prometheus metrics endpoint
      port: 8000
    # Logging configuration
    logging:
      level: info  # debug, info, warn, error
      format: json  # json or text
      # Log aggregation settings
      aggregation:
        enabled: true
        destination: cloud-logging  # cloud-logging, stdout, or custom
    # Tracing configuration (optional)
    tracing:
      enabled: false
      # provider: jaeger  # jaeger, zipkin, or custom
      # endpoint: http://jaeger:14268/api/traces
    # Application Insights (optional)
    application_insights:
      enabled: true
      instrumentation_key_secret: application-insights-instrumentation-key

security:
  policies:
    secretsInEnvAllowed: true
    # Additional security policies
    runAsNonRoot: true
    readOnlyRootFilesystem: false  # Set to true if app doesn't need write access (audio processing may need temp files)
    allowPrivilegeEscalation: false
    # Network policies
    network_policy:
      enabled: true
      # Allow ingress from specific namespaces or pods
      ingress:
        - from:
          - namespaceSelector:
              matchLabels:
                name: monitoring
          ports:
          - protocol: TCP
            port: 8000
      # Allow egress to specific destinations
      egress:
        - to:
          - namespaceSelector:
              matchLabels:
                name: external-services
          ports:
          - protocol: TCP
            port: 443  # HTTPS for Azure OpenAI, Azure AI Search, Azure Storage
        - to:
          - namespaceSelector:
              matchLabels:
                name: azure-services
          ports:
          - protocol: TCP
            port: 443

secrets:
  provider: azureKeyVault
  # Azure Key Vault configuration - Secret Manager Minion reads this from WDF
  # Replace these values with your actual Azure Key Vault credentials
  azureKeyVault:
    vault_name: wdf-secret-manager-test  # Your Azure Key Vault name
    vault_url: https://wdf-secret-manager-test.vault.azure.net/  # Your Azure Key Vault URL
    tenant_id: d14f9525-afc9-4197-b391-5de78abfaab5  # Your Azure Tenant ID
    client_id: 577d5e76-7ca1-4191-97bd-570b5096e23a  # Your Azure Service Principal Client ID
    client_secret: vc68Q~i3B6WU00zIcElAR3hg3tvrjAR_dkUplbGv  # Your Azure Service Principal Client Secret
    # Note: subscription_id is not required for Azure Key Vault connection
    # If needed, it can be retrieved from environment variables (e.g., AZURE_SUBSCRIPTION_ID)
    region: East US  # Your Azure region
  secretRefs:
    - name: azure-openai-endpoint
      injectAs: env
      envVar: AZURE_OPENAI_ENDPOINT
    - name: azure-openai-api-key
      injectAs: env
      envVar: AZURE_OPENAI_API_KEY
    - name: azure-search-endpoint
      injectAs: env
      envVar: AZURE_SEARCH_ENDPOINT
    - name: azure-search-api-key
      injectAs: env
      envVar: AZURE_SEARCH_API_KEY
    - name: azure-storage-account-name
      injectAs: env
      envVar: AZURE_STORAGE_ACCOUNT_NAME
    - name: azure-storage-account-key
      injectAs: env
      envVar: AZURE_STORAGE_ACCOUNT_KEY
    - name: azure-storage-connection-string
      injectAs: env
      envVar: AZURE_STORAGE_CONNECTION_STRING
    - name: azure-storage-container
      injectAs: env
      envVar: AZURE_STORAGE_CONTAINER
    - name: application-insights-instrumentation-key
      injectAs: env
      envVar: APPLICATIONINSIGHTS_CONNECTION_STRING
    # The Secret Manager Minion will fetch these from Azure Key Vault
    # using the credentials above and place them in NFS env directory:
    # /mnt/nfs/<org_id>/user-<user_id>/<version>/secrets/<deployment_id>/

# Azure Container Registry (ACR) configuration
# Deployment Minion reads this from WDF to push Docker images
# Note: ACR authentication credentials (AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET)
# must be stored in NFS secrets/.env file at /mnt/nfs/.../secrets/.env
# The Deployment Minion will read these credentials from NFS secrets/.env for ACR authentication
acr:
  registry: uvvoiceragacr  # Your ACR registry name (without .azurecr.io)
  registry_url: uvvoiceragacr.azurecr.io  # Full ACR URL
  resource_group: uv-voicerag-rg  # Resource group for ACR
  # Azure credentials for ACR authentication are read from NFS secrets/.env file:
  # - AZURE_TENANT_ID
  # - AZURE_CLIENT_ID
  # - AZURE_CLIENT_SECRET
  # These must be placed in the NFS secrets/.env file before deployment

# ==============================================================================
# ADDITIONAL CONFIGURATION
# ==============================================================================

# Note: Additional metadata (description, version, maintainer, documentation)
# should be added to the top-level metadata section above, not here.
# This section contains additional configuration that complements the WDF structure.

# Dependencies and prerequisites
dependencies:
  # External service dependencies
  services:
    - name: azure-openai-service
      type: external
      required: true
      description: "Azure OpenAI service with gpt-realtime-mini (for transcription and TTS), gpt-5-mini (for chat), and text-embedding-3-large (for embeddings)"
    - name: azure-ai-search
      type: external
      required: true
      description: "Azure AI Search service for vector search and RAG retrieval. Standard tier with 1 replica and free semantic search level."
    - name: azure-blob-storage
      type: external
      required: true
      description: "Azure Blob Storage for storing documents, audio files, and embeddings. Standard tier with ZRS (Zone-redundant storage)."
    - name: azure-container-apps
      type: external
      required: false
      description: "Azure Container Apps for hosting the application. Consumption plan with 1 CPU core, 2.0 GB RAM."
    - name: azure-monitor
      type: external
      required: false
      description: "Azure Monitor for application insights and logging. Pay-as-you-go tier."
  # Infrastructure dependencies
  infrastructure:
    - name: azure-container-registry
      type: container-registry
      required: true
      description: "Azure Container Registry for storing Docker images"
    - name: azure-container-instances
      type: compute
      required: false
      description: "Azure Container Instances for hosting containers (alternative to Kubernetes)"
    - name: azure-kubernetes-service
      type: kubernetes
      required: false
      description: "Azure Kubernetes Service for orchestrated container deployment"
  # Data dependencies
  data:
    - name: document-index
      type: search-index
      required: true
      description: "Azure AI Search index containing document embeddings for RAG retrieval. Must be created and populated before deployment."
      location:
        type: azure-ai-search
        index_name: voicerag-index
    - name: document-storage
      type: blob-storage
      required: true
      description: "Azure Blob Storage container containing source documents for indexing and retrieval"
      location:
        type: azure-blob-storage
        container: content

# Rollback configuration
rollback:
  enabled: true
  automatic: true
  triggers:
    - health_check_failure
    - performance_degradation
    - error_rate_threshold
    - manual_trigger
  # Rollback strategy
  strategy:
    type: immediate  # immediate or gradual
    keep_previous_replicas: 1  # Keep 1 replica of previous version during rollback

# Backup and disaster recovery
backup:
  enabled: false  # Enable if persistent data needs backup
  # Configuration if enabled:
  # schedule: "0 2 * * *"  # Daily at 2 AM
  # retention: "30d"  # Keep backups for 30 days
  # destination: "az://backup-container/workload-backups"
  # Note: Application data (document index, embeddings) should be backed up separately if needed
