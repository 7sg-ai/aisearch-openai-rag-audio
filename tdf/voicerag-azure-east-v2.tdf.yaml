apiVersion: tdf.7sg.ai/v1
kind: TargetDefinition
metadata:
  name: voicerag-azure-east-v2
  version: "1.0.0"
  displayName: Azure East - VoiceRAG Container Apps Target
  description: >-
    Azure target in eastus2 for deploying the aisearch-openai-rag-audio (VoiceRAG)
    app on Azure Container Apps with ACR, Key Vault, Azure AI Search, and Blob
    Storage.
  tags:
    provider: azure
    geo: us
    tier: native
    platform: container-apps
target:
  provider: azure
  regions:
    - eastus2
  geography:
    continent: na
    country: us
    zoneGroup: us-central
  networking:
    defaultNetworkPolicy: private
  services:
    - name: container-apps
      type: container-platform
      providerService: Azure Container Apps
      capabilities:
        supportsManagedIdentity: true
        supportsCustomDomains: true
        supportsScaleToZero: true
        supportsDapr: true
      defaults:
        resourceGroup: rg-voicerag-test
        location: eastus2
        environment: voicerag-test-aca-env
        logAnalyticsWorkspace: voicerag-logs

    - name: acr
      type: container-registry
      providerService: Azure Container Registry
      endpoints:
        registry: uvvoiceragtestacr.azurecr.io
      defaults:
        registryName: uvvoiceragtestacr
        resourceGroup: rg-voicerag-test

    - name: ai-search
      type: vector-store
      providerService: Azure AI Search
      capabilities:
        supportsVectorSearch: true
        supportsSemanticSearch: true
        supportsPrivateEndpoints: true

    - name: blob-storage
      type: object-store
      providerService: Azure Blob Storage
      capabilities:
        supportsPrivateEndpoints: true

    - name: keyvault
      type: secrets
      providerService: Azure Key Vault
      endpoints:
        vault: https://wdf-secret-manager.vault.azure.net/
      capabilities:
        supportsPrivateEndpoints: true

    - name: managed-identity
      type: identity
      providerService: Managed Identity

    - name: observability
      type: observability
      providerService: Azure Monitor / Application Insights

  infrastructure:
    containerAppsEnvironment:
      name: voicerag-test-aca-env
      resourceGroup: rg-voicerag-test
      location: eastus2
    containerRegistry:
      name: uvvoiceragtestacr
      service: acr
    secretStores:
      - name: wdf-secret-manager
        service: keyvault
